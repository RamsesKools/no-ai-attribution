name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --locked --python ${{ matrix.python-version }} pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy

  hook:
    # Runs the hook the way a consumer does, through pre-commit itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: reject an AI-attributed message
        run: |
          echo 'Fix x

          Co-authored-by: Claude <noreply@anthropic.com>' > msg.txt
          ! uvx pre-commit try-repo . no-ai-attribution \
              --hook-stage commit-msg --commit-msg-filename msg.txt
      - name: accept a clean message
        run: |
          echo 'Fix x' > msg.txt
          uvx pre-commit try-repo . no-ai-attribution \
              --hook-stage commit-msg --commit-msg-filename msg.txt

  global-hook:
    # Runs the machine-wide git hook in the layouts the README describes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/test_global_hook.sh
