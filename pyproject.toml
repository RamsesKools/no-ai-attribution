[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "no-ai-attribution"
version = "0.1.0"
description = "pre-commit hook that rejects AI attribution in git commit messages"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ramses Kools" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/RamsesKools/no-ai-attribution"

[project.scripts]
no-ai-attribution = "no_ai_attribution.main:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "RUF"]

[tool.mypy]
files = ["src"]
strict = true
